[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cube-robot-runtime"
version = "0.1.0"
description = "Standalone Raspberry Pi robot runtime"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cube-robot = "cube_robot_runtime.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cube_robot_runtime"]
